<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Монстр на банке</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
(function () {
  AFRAME.registerComponent('ar-monster', {
    schema: {
      size:        {type: 'number',  default: 0.13},
      canRadius:   {type: 'number',  default: 0.16},
      canHeight:   {type: 'number',  default: 0.72},
      orbitSpeed:  {type: 'number',  default: 1.3},
      modeSeconds: {type: 'number',  default: 6.0},
      showCan:     {type: 'boolean', default: true},
      showBody:    {type: 'boolean', default: true}
    },

    init: function () {
      const T = window.THREE;
      const s = this.data.size;

      this.clock = 0;
      this.modeTime = 0;
      this.modes = ['hug', 'run', 'jump'];
      this.modeIndex = 0;
      this.mode = this.modes[0];

      this.root = new T.Group();
      this.el.object3D.add(this.root);

      const skin   = new T.MeshStandardMaterial({color: 0x4DE3F2, roughness: 0.42, metalness: 0.05});
      const light  = new T.MeshStandardMaterial({color: 0xEAFDFF, roughness: 0.5});
      const dark   = new T.MeshStandardMaterial({color: 0x14212B, roughness: 0.6});
      const hornM  = new T.MeshStandardMaterial({color: 0xFFC857, roughness: 0.35, metalness: 0.2});
      const mouthM = new T.MeshStandardMaterial({color: 0xFF6B6B, roughness: 0.5});

      this.body = new T.Group();
      this.body.visible = this.data.showBody;
      this.root.add(this.body);

      const torso = new T.Mesh(new T.SphereGeometry(s, 24, 20), skin);
      torso.scale.set(1, 1.06, 0.94);
      this.body.add(torso);

      [-1, 1].forEach(function (side) {
        const eye = new T.Mesh(new T.SphereGeometry(s * 0.30, 16, 14), light);
        eye.position.set(side * s * 0.34, s * 0.20, s * 0.72);
        this.body.add(eye);

        const pupil = new T.Mesh(new T.SphereGeometry(s * 0.14, 12, 12), dark);
        pupil.position.set(side * s * 0.36, s * 0.20, s * 0.88);
        this.body.add(pupil);
      }, this);

      [-1, 1].forEach(function (side) {
        const h = new T.Mesh(new T.ConeGeometry(s * 0.17, s * 0.62, 12), hornM);
        h.position.set(side * s * 0.45, s * 0.98, 0);
        h.rotation.z = -side * 0.42;
        this.body.add(h);
      }, this);

      const smile = new T.Mesh(new T.TorusGeometry(s * 0.26, s * 0.055, 8, 18, Math.PI), mouthM);
      smile.position.set(0, s * 0.02, s * 0.80);
      smile.rotation.x = Math.PI;
      this.body.add(smile);

      [-1, 1].forEach(function (side) {
        const foot = new T.Mesh(new T.SphereGeometry(s * 0.27, 14, 12), skin);
        foot.position.set(side * s * 0.38, -s * 0.90, s * 0.16);
        foot.scale.set(1, 0.72, 1.25);
        this.body.add(foot);
      }, this);

      this.arms = [];
      [-1, 1].forEach(function (side) {
        const pivot = new T.Group();
        pivot.position.set(side * s * 0.92, s * 0.10, 0);
        this.body.add(pivot);

        const arm = new T.Mesh(new T.CylinderGeometry(s * 0.115, s * 0.115, s * 0.85, 12), skin);
        arm.position.y = -s * 0.42;
        pivot.add(arm);

        const hand = new T.Mesh(new T.SphereGeometry(s * 0.16, 12, 12), skin);
        hand.position.y = -s * 0.85;
        pivot.add(hand);

        this.arms.push({pivot: pivot, side: side});
      }, this);

      if (this.data.showCan) {
        const can = new T.Mesh(
          new T.CylinderGeometry(this.data.canRadius, this.data.canRadius, this.data.canHeight, 40, 1, true),
          new T.MeshBasicMaterial({color: 0x22D3EE, transparent: true, opacity: 0.16, side: T.DoubleSide})
        );
        can.position.set(0, 0, -this.data.canRadius);
        this.el.object3D.add(can);
      }
    },

    nextMode: function () {
      this.modeIndex = (this.modeIndex + 1) % this.modes.length;
      this.mode = this.modes[this.modeIndex];
      this.modeTime = 0;
      this.el.emit('monster-mode', {mode: this.mode}, false);
    },

    setArms: function (spread, forward) {
      this.arms.forEach(function (a) {
        a.pivot.rotation.z = a.side * spread;
        a.pivot.rotation.x = forward;
      });
    },

    tick: function (time, delta) {
      const dt = Math.min(delta, 60) / 1000;
      this.clock += dt;
      this.modeTime += dt;

      const d = this.data;
      const s = d.size;
      const half = d.canHeight / 2;
      const groundY = -half;
      const axisZ = -d.canRadius;
      const R = d.canRadius + s * 0.95;

      if (this.modeTime >= d.modeSeconds) this.nextMode();

      if (this.mode === 'hug') {
        const sway = Math.sin(this.clock * 1.5);
        this.root.position.set(0, groundY + s * 1.02 + sway * s * 0.04, s * 0.92);
        this.root.rotation.set(0, sway * 0.18, sway * 0.05);
        this.setArms(-0.30, -1.05);
        this.root.scale.set(1 - sway * 0.03, 1 + sway * 0.04, 1 - sway * 0.03);

      } else if (this.mode === 'run') {
        const th = this.clock * d.orbitSpeed;
        const bob = Math.abs(Math.sin(this.clock * d.orbitSpeed * 2.6));
        this.root.position.set(
          R * Math.sin(th),
          groundY + s * 1.0 + bob * s * 0.28,
          axisZ + R * Math.cos(th)
        );
        this.root.rotation.set(-0.06, th + Math.PI / 2, -0.12);
        const swing = Math.sin(this.clock * d.orbitSpeed * 5.2);
        this.arms.forEach(function (a) {
          a.pivot.rotation.x = -0.35 + swing * a.side * 0.7;
          a.pivot.rotation.z = a.side * 0.35;
        });
        this.root.scale.set(1, 1, 1);

      } else {
        const T = 2.6;
        const u = (this.clock % T) / T;
        const frontZ = s * 0.95;
        let y, z, k = 0;

        if (u < 0.18) {
          const t = u / 0.18;
          y = groundY + s * 1.02 - t * s * 0.25;
          z = frontZ;
          k = -0.18 * t;
        } else if (u < 0.40) {
          const t = (u - 0.18) / 0.22;
          y = (groundY + s * 0.77) + (half + s * 0.80 - (groundY + s * 0.77)) * t;
          z = frontZ + (axisZ - frontZ) * t;
          k = 0.16 * Math.sin(t * Math.PI);
        } else if (u < 0.70) {
          const t = (u - 0.40) / 0.30;
          y = half + s * 0.80 + Math.abs(Math.sin(t * Math.PI * 2)) * s * 0.18;
          z = axisZ;
          k = -0.10 * Math.abs(Math.sin(t * Math.PI * 2));
        } else if (u < 0.88) {
          const t = (u - 0.70) / 0.18;
          y = (half + s * 0.80) + ((groundY + s * 1.02) - (half + s * 0.80)) * t;
          z = axisZ + (frontZ - axisZ) * t;
          k = 0.12 * Math.sin(t * Math.PI);
        } else {
          const t = (u - 0.88) / 0.12;
          y = groundY + s * 1.02;
          z = frontZ;
          k = -0.22 * Math.sin(t * Math.PI);
        }

        this.root.position.set(0, y, z);
        this.root.rotation.set(0, 0, 0);
        this.setArms(0.62, 0);
        this.root.scale.set(1 - k * 0.55, 1 + k, 1 - k * 0.55);
      }
    }
  });
})();
</script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0F1117; }

  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(15,17,23,.85); color: #F5EFE6;
    padding: 10px 18px; border-radius: 12px;
    border: 1px solid rgba(34,211,238,.45);
    font-family: -apple-system, system-ui, sans-serif; font-size: 14px;
    text-align: center; z-index: 1000; pointer-events: none; max-width: 88vw;
    transition: background .25s, color .25s;
  }
  #hud.found { background: rgba(34,211,238,.92); color: #0F1117; border-color: #22D3EE; }
  #hudMode { font-size: 12px; opacity: .75; margin-top: 4px; }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(245,239,230,.7); font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px; z-index: 1000; pointer-events: none; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  /* Панель диагностики: показывается, только если что-то пошло не так */
  #fatal {
    position: fixed; inset: 0; z-index: 2000; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(15,17,23,.97);
    font-family: -apple-system, system-ui, sans-serif;
  }
  #fatal.show { display: flex; }
  #fatalBox {
    background: #1A1F2B; border: 1px solid #F87171; border-radius: 12px;
    padding: 22px; max-width: 420px; width: 100%; color: #F5EFE6;
  }
  #fatalBox h2 { margin: 0 0 12px; font-size: 17px; color: #F87171; }
  #fatalBox p { margin: 0 0 10px; font-size: 14px; line-height: 1.5; }
  #fatalBox code {
    display: block; background: #0B0E14; padding: 10px; border-radius: 6px;
    font-size: 11px; word-break: break-all; margin-top: 12px; color: #9AA4B2;
  }
  #fatalBox .good { color: #4DE3F2; }
</style>
</head>
<body>

<div id="hud">
  <div id="hudStatus">📸 Наведите камеру</div>
  <div id="hudMode">Монстр обнимает банку</div>
</div>
<div id="hint">Нажмите на экран, чтобы сменить анимацию</div>

<div id="fatal"><div id="fatalBox"></div></div>

<!--
  ═══════════════════════════════════════════════════════════════
   ЕДИНСТВЕННАЯ СТРОКА, КОТОРУЮ НУЖНО ПОМЕНЯТЬ:  imageTargetSrc

   СЕЙЧАС стоит тестовая карточка MindAR — чтобы проверить,
   что весь конвейер работает. Монстр появится на тестовой картинке.

   КОГДА БУДЕТ ГОТОВ targets.mind ОТ ВАШЕЙ БАНКИ — замените ссылку на:
       imageTargetSrc: ./targets.mind;

  ⚠️ Файл targets.mind ДОЛЖЕН лежать рядом с этим HTML на хостинге.
     Если его нет — камера не запустится вообще (MindAR падает на загрузке).
  ═══════════════════════════════════════════════════════════════
-->
<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; color: #FFFFFF; intensity: 0.9" position="0.4 1 1"></a-entity>
  <a-entity light="type: hemisphere; color: #CFFAFE; groundColor: #4C1D95; intensity: 0.5"></a-entity>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity ar-monster="size: 0.13; canRadius: 0.16; canHeight: 0.72; showCan: true"></a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  const sceneEl   = document.querySelector('a-scene');
  const hud       = document.getElementById('hud');
  const hudStatus = document.getElementById('hudStatus');
  const hudMode   = document.getElementById('hudMode');
  const fatal     = document.getElementById('fatal');
  const fatalBox  = document.getElementById('fatalBox');

  const MODE_LABELS = {
    hug:  'Монстр обнимает банку',
    run:  'Монстр бегает вокруг банки',
    jump: 'Монстр запрыгивает на банку'
  };

  // ─── Достаём ссылку на target прямо из атрибута сцены ───────────
  function getTargetUrl() {
    const raw = sceneEl.getAttribute('mindar-image') || '';
    const m = /imageTargetSrc:\s*([^;]+)/.exec(raw);
    return m ? m[1].trim() : null;
  }

  function fatalPanel(title, body, detail) {
    fatalBox.innerHTML =
      '<h2>' + title + '</h2>' + body +
      (detail ? '<code>' + detail + '</code>' : '');
    fatal.classList.add('show');
  }

  // ─── ПРЕДПОЛЁТНАЯ ПРОВЕРКА: существует ли файл target? ─────────
  // Это самая частая причина чёрного экрана: MindAR не может
  // загрузить .mind и вообще не открывает камеру.
  function preflight() {
    const url = getTargetUrl();
    if (!url) {
      fatalPanel(
        '⚠️ Не указан imageTargetSrc',
        '<p>В атрибуте <b>mindar-image</b> у тега &lt;a-scene&gt; нет ссылки на target-файл.</p>',
        null
      );
      return Promise.resolve(false);
    }

    return fetch(url, {method: 'GET', cache: 'no-store'})
      .then(function (res) {
        if (res.ok) return true;

        const isLocal = url.indexOf('./') === 0 || url.indexOf('/') === 0;
        fatalPanel(
          '⚠️ Файл target не найден',
          '<p>MindAR не смог загрузить:<br><b>' + url + '</b></p>' +
          (isLocal
            ? '<p>Похоже, вы ещё не создали <b>targets.mind</b> от вашей банки ' +
              'или не загрузили его на хостинг рядом с этим HTML-файлом.</p>' +
              '<p class="good">Быстрая проверка: замените в атрибуте imageTargetSrc ' +
              'ссылку на тестовую карточку MindAR — она уже вписана в файле выше.</p>'
            : '<p>Проверьте ссылку.</p>'),
          'HTTP ' + res.status + ' · ' + url
        );
        return false;
      })
      .catch(function (err) {
        fatalPanel(
          '⚠️ Не удалось получить target-файл',
          '<p>Запрос к <b>' + url + '</b> не прошёл.</p>' +
          '<p>Обычно это значит, что файла нет по этому адресу.</p>',
          String(err && err.message ? err.message : err)
        );
        return false;
      });
  }

  // ─── Страховка: если сцена долго не загружается ────────────────
  const loadTimer = setTimeout(function () {
    if (!window.__arStarted) {
      fatalPanel(
        '⚠️ AR не запустился',
        '<p>Сцена не загрузилась за 12 секунд.</p>' +
        '<p>Чаще всего причина — отсутствующий или битый <b>targets.mind</b>, ' +
        'либо заблокированные скрипты A-Frame/MindAR.</p>',
        'Проверьте интернет и наличие target-файла'
      );
    }
  }, 12000);

  // ─── Запуск ────────────────────────────────────────────────────
  preflight().then(function (ok) {
    if (!ok) {
      clearTimeout(loadTimer);
      return;
    }

    const targetEl = document.querySelector('[mindar-image-target]');

    targetEl.addEventListener('targetFound', function () {
      hudStatus.textContent = '✅ Изображение найдено';
      hud.classList.add('found');
    });

    targetEl.addEventListener('targetLost', function () {
      hudStatus.textContent = '📸 Наведите камеру';
      hud.classList.remove('found');
    });

    sceneEl.addEventListener('loaded', function () {
      clearTimeout(loadTimer);

      try {
        sceneEl.systems['mindar-image-system'].start();
        window.__arStarted = true;
      } catch (err) {
        fatalPanel(
          '⚠️ Ошибка запуска AR',
          '<p>Камера не открылась.</p>' +
          '<p>Проверьте, что страница открыта по <b>https://</b>, ' +
          'и что доступ к камере разрешён в настройках Safari.</p>',
          String(err && err.message ? err.message : err)
        );
        return;
      }

      const monsterEl = document.querySelector('[ar-monster]');
      if (monsterEl) {
        monsterEl.addEventListener('monster-mode', function (e) {
          hudMode.textContent = MODE_LABELS[e.detail.mode] || '';
        });
      }
    });
  });

  // ─── Тап = сменить анимацию ────────────────────────────────────
  document.addEventListener('click', function () {
    const monsterEl = document.querySelector('[ar-monster]');
    if (monsterEl && monsterEl.components['ar-monster']) {
      monsterEl.components['ar-monster'].nextMode();
    }
  });
})();
</script>

</body>
</html>

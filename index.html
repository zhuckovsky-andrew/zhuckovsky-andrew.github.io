<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Монстр на банке</title>

<!-- 1. A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<!-- 2. MindAR для A-Frame (проверенная связка, работает на iOS) -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<!-- 3. Компонент монстра. Регистрируется ДО сцены — так требует A-Frame -->
<script>
(function () {
  AFRAME.registerComponent('ar-monster', {
    schema: {
      size:        {type: 'number',  default: 0.13},  // размер монстра (1.0 = ширина этикетки)
      canRadius:   {type: 'number',  default: 0.16},  // радиус банки = ширина этикетки / 6.28
      canHeight:   {type: 'number',  default: 0.72},  // высота этикетки на банке
      orbitSpeed:  {type: 'number',  default: 1.3},   // скорость бега вокруг банки
      modeSeconds: {type: 'number',  default: 6.0},   // сколько длится каждая анимация
      showCan:     {type: 'boolean', default: true},  // показать полупрозрачный макет банки
      showBody:    {type: 'boolean', default: true}   // false = отключить примитивы (для своей 3D-модели)
    },

    init: function () {
      const T = window.THREE;
      const s = this.data.size;

      this.clock = 0;
      this.modeTime = 0;
      this.modes = ['hug', 'run', 'jump'];
      this.modeIndex = 0;
      this.mode = this.modes[0];

      this.root = new T.Group();
      this.el.object3D.add(this.root);

      const skin  = new T.MeshStandardMaterial({color: 0x4DE3F2, roughness: 0.42, metalness: 0.05});
      const light = new T.MeshStandardMaterial({color: 0xEAFDFF, roughness: 0.5});
      const dark  = new T.MeshStandardMaterial({color: 0x14212B, roughness: 0.6});
      const hornM = new T.MeshStandardMaterial({color: 0xFFC857, roughness: 0.35, metalness: 0.2});
      const mouthM= new T.MeshStandardMaterial({color: 0xFF6B6B, roughness: 0.5});

      // ---- корпус ----
      this.body = new T.Group();
      this.body.visible = this.data.showBody;
      this.root.add(this.body);

      const torso = new T.Mesh(new T.SphereGeometry(s, 24, 20), skin);
      torso.scale.set(1, 1.06, 0.94);
      this.body.add(torso);

      // ---- глаза ----
      [-1, 1].forEach(function (side) {
        const eye = new T.Mesh(new T.SphereGeometry(s * 0.30, 16, 14), light);
        eye.position.set(side * s * 0.34, s * 0.20, s * 0.72);
        this.body.add(eye);

        const pupil = new T.Mesh(new T.SphereGeometry(s * 0.14, 12, 12), dark);
        pupil.position.set(side * s * 0.36, s * 0.20, s * 0.88);
        this.body.add(pupil);
      }, this);

      // ---- рожки ----
      [-1, 1].forEach(function (side) {
        const h = new T.Mesh(new T.ConeGeometry(s * 0.17, s * 0.62, 12), hornM);
        h.position.set(side * s * 0.45, s * 0.98, 0);
        h.rotation.z = -side * 0.42;
        this.body.add(h);
      }, this);

      // ---- улыбка ----
      const smile = new T.Mesh(new T.TorusGeometry(s * 0.26, s * 0.055, 8, 18, Math.PI), mouthM);
      smile.position.set(0, s * 0.02, s * 0.80);
      smile.rotation.x = Math.PI;
      this.body.add(smile);

      // ---- лапки ----
      [-1, 1].forEach(function (side) {
        const foot = new T.Mesh(new T.SphereGeometry(s * 0.27, 14, 12), skin);
        foot.position.set(side * s * 0.38, -s * 0.90, s * 0.16);
        foot.scale.set(1, 0.72, 1.25);
        this.body.add(foot);
      }, this);

      // ---- руки (на пивотах, чтобы махать) ----
      this.arms = [];
      [-1, 1].forEach(function (side) {
        const pivot = new T.Group();
        pivot.position.set(side * s * 0.92, s * 0.10, 0);
        this.body.add(pivot);

        const arm = new T.Mesh(new T.CylinderGeometry(s * 0.115, s * 0.115, s * 0.85, 12), skin);
        arm.position.y = -s * 0.42;
        pivot.add(arm);

        const hand = new T.Mesh(new T.SphereGeometry(s * 0.16, 12, 12), skin);
        hand.position.y = -s * 0.85;
        pivot.add(hand);

        this.arms.push({pivot: pivot, side: side});
      }, this);

      // ---- полупрозрачный макет банки (для калибровки) ----
      if (this.data.showCan) {
        const can = new T.Mesh(
          new T.CylinderGeometry(this.data.canRadius, this.data.canRadius, this.data.canHeight, 40, 1, true),
          new T.MeshBasicMaterial({
            color: 0x22D3EE, transparent: true, opacity: 0.16, side: T.DoubleSide
          })
        );
        can.position.set(0, 0, -this.data.canRadius);
        this.el.object3D.add(can);
      }
    },

    nextMode: function () {
      this.modeIndex = (this.modeIndex + 1) % this.modes.length;
      this.mode = this.modes[this.modeIndex];
      this.modeTime = 0;
      this.el.emit('monster-mode', {mode: this.mode}, false);
    },

    setArms: function (spread, forward) {
      this.arms.forEach(function (a) {
        a.pivot.rotation.z = a.side * spread;
        a.pivot.rotation.x = forward;
      });
    },

    tick: function (time, delta) {
      const dt = Math.min(delta, 60) / 1000;
      this.clock += dt;
      this.modeTime += dt;

      const d = this.data;
      const s = d.size;
      const half = d.canHeight / 2;         // верх банки
      const groundY = -half;                // низ банки
      const axisZ = -d.canRadius;           // ось банки (спрятана за этикеткой)
      const R = d.canRadius + s * 0.95;     // радиус орбиты монстра

      if (this.modeTime >= d.modeSeconds) this.nextMode();

      if (this.mode === 'hug') {
        // Обнимает банку: стоит вплотную, руки вперёд и внутрь, покачивается
        const sway = Math.sin(this.clock * 1.5);
        this.root.position.set(0, groundY + s * 1.02 + sway * s * 0.04, s * 0.92);
        this.root.rotation.set(0, sway * 0.18, sway * 0.05);
        this.setArms(-0.30, -1.05);
        this.root.scale.set(1 - sway * 0.03, 1 + sway * 0.04, 1 - sway * 0.03);

      } else if (this.mode === 'run') {
        // Бегает по кругу вокруг банки
        const th = this.clock * d.orbitSpeed;
        const bob = Math.abs(Math.sin(this.clock * d.orbitSpeed * 2.6));
        this.root.position.set(
          R * Math.sin(th),
          groundY + s * 1.0 + bob * s * 0.28,
          axisZ + R * Math.cos(th)
        );
        this.root.rotation.set(-0.06, th + Math.PI / 2, -0.12);
        const swing = Math.sin(this.clock * d.orbitSpeed * 5.2);
        this.arms.forEach(function (a) {
          a.pivot.rotation.x = -0.35 + swing * a.side * 0.7;
          a.pivot.rotation.z = a.side * 0.35;
        });
        this.root.scale.set(1, 1, 1);

      } else {
        // Запрыгивает на банку и обратно
        const T = 2.6;
        const u = (this.clock % T) / T;
        const frontZ = s * 0.95;
        let y, z, k = 0;   // k — растяжение/приседание

        if (u < 0.18) {                       // присед перед прыжком
          const t = u / 0.18;
          y = groundY + s * 1.02 - t * s * 0.25;
          z = frontZ;
          k = -0.18 * t;
        } else if (u < 0.40) {                // прыжок наверх
          const t = (u - 0.18) / 0.22;
          y = (groundY + s * 0.77) + (half + s * 0.80 - (groundY + s * 0.77)) * t;
          z = frontZ + (axisZ - frontZ) * t;
          k = 0.16 * Math.sin(t * Math.PI);
        } else if (u < 0.70) {                // стоит на банке
          const t = (u - 0.40) / 0.30;
          y = half + s * 0.80 + Math.abs(Math.sin(t * Math.PI * 2)) * s * 0.18;
          z = axisZ;
          k = -0.10 * Math.abs(Math.sin(t * Math.PI * 2));
        } else if (u < 0.88) {                // прыжок вниз
          const t = (u - 0.70) / 0.18;
          y = (half + s * 0.80) + ((groundY + s * 1.02) - (half + s * 0.80)) * t;
          z = axisZ + (frontZ - axisZ) * t;
          k = 0.12 * Math.sin(t * Math.PI);
        } else {                              // приземление
          const t = (u - 0.88) / 0.12;
          y = groundY + s * 1.02;
          z = frontZ;
          k = -0.22 * Math.sin(t * Math.PI);
        }

        this.root.position.set(0, y, z);
        this.root.rotation.set(0, 0, 0);
        this.setArms(0.62, 0);
        this.root.scale.set(1 - k * 0.55, 1 + k, 1 - k * 0.55);
      }
    }
  });
})();
</script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0F1117; }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(15,17,23,.85); color: #F5EFE6;
    padding: 10px 18px; border-radius: 12px;
    border: 1px solid rgba(34,211,238,.45);
    font-family: -apple-system, system-ui, sans-serif; font-size: 14px;
    text-align: center; z-index: 1000; pointer-events: none; max-width: 88vw;
    transition: background .25s, color .25s;
  }
  #hud.found { background: rgba(34,211,238,.92); color: #0F1117; border-color: #22D3EE; }
  #hudMode { font-size: 12px; opacity: .75; margin-top: 4px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(245,239,230,.7); font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px; z-index: 1000; pointer-events: none; text-align: center;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="hudStatus">📸 Наведите камеру на банку</div>
  <div id="hudMode">Монстр обнимает банку</div>
</div>
<div id="hint">Нажмите на экран, чтобы сменить анимацию</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Свет: без него MeshStandardMaterial будет чёрным -->
  <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; color: #FFFFFF; intensity: 0.9" position="0.4 1 1"></a-entity>
  <a-entity light="type: hemisphere; color: #CFFAFE; groundColor: #4C1D95; intensity: 0.5"></a-entity>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Монстр из примитивов -->
    <a-entity ar-monster="size: 0.13; canRadius: 0.16; canHeight: 0.72; showCan: true"></a-entity>

    <!-- Когда будет готова своя 3D-модель, замените блок выше на:
         <a-entity ar-monster="showBody: false; showCan: false"></a-entity>
         <a-entity gltf-model="url(./monster.glb)"
                   position="0 0 0" scale="0.3 0.3 0.3"></a-entity>
         Для проигрывания анимаций из glTF добавьте aframe-extras и animation-mixer -->

  </a-entity>
</a-scene>

<script>
  const sceneEl = document.querySelector('a-scene');
  const hudStatus = document.getElementById('hudStatus');
  const hudMode = document.getElementById('hudMode');

  const MODE_LABELS = {
    hug:  'Монстр обнимает банку',
    run:  'Монстр бегает вокруг банки',
    jump: 'Монстр запрыгивает на банку'
  };

  const targetEl = document.querySelector('[mindar-image-target]');

  targetEl.addEventListener('targetFound', function () {
    hudStatus.textContent = '✅ Банка распознана';
    document.getElementById('hud').classList.add('found');
  });

  targetEl.addEventListener('targetLost', function () {
    hudStatus.textContent = '📸 Наведите камеру на банку';
    document.getElementById('hud').classList.remove('found');
  });

  sceneEl.addEventListener('loaded', function () {
    // Запуск камеры
    sceneEl.systems['mindar-image-system'].start();

    // Подписка на смену анимации
    const monsterEl = document.querySelector('[ar-monster]');
    if (monsterEl) {
      monsterEl.addEventListener('monster-mode', function (e) {
        hudMode.textContent = MODE_LABELS[e.detail.mode] || '';
      });
    }
  });

  // Тап по экрану = переключить анимацию
  document.addEventListener('click', function () {
    const monsterEl = document.querySelector('[ar-monster]');
    if (monsterEl && monsterEl.components['ar-monster']) {
      monsterEl.components['ar-monster'].nextMode();
    }
  });
</script>

</body>
</html>

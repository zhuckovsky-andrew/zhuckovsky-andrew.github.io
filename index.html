<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Монстр на банке</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
// ─── Компонент монстра ────────────────────────────────────────────────
// Всё создание обёрнуто в try/catch: если монстр почему-то не соберётся,
// камера всё равно запустится. Так всегда видно, что именно сломалось —
// AR-трекинг или построение модели.
(function () {
  if (typeof AFRAME === 'undefined') return;

  AFRAME.registerComponent('ar-monster', {
    schema: {
      size:        {type: 'number',  default: 0.13},
      canRadius:   {type: 'number',  default: 0.16},
      canHeight:   {type: 'number',  default: 0.72},
      orbitSpeed:  {type: 'number',  default: 1.3},
      modeSeconds: {type: 'number',  default: 6.0},
      showCan:     {type: 'boolean', default: true},
      showBody:    {type: 'boolean', default: true}
    },

    init: function () {
      // ⚠️ ГЛАВНОЕ ИСПРАВЛЕНИЕ: A-Frame отдаёт Three.js как AFRAME.THREE.
      // window.THREE может быть undefined — раньше это роняло объект сцены
      // и сцена никогда не доходила до состояния 'loaded'.
      const T = window.THREE || (window.AFRAME && AFRAME.THREE) || null;

      if (!T) {
        console.error('[AR] Three.js недоступен — монстр не создан');
        this.failed = true;
        return;
      }

      this.T = T;

      try {
        this.build();
      } catch (e) {
        console.error('[AR] Ошибка сборки монстра:', e);
        this.failed = true;
      }
    },

    build: function () {
      const T = this.T;
      const s = this.data.size;

      this.clock = 0;
      this.modeTime = 0;
      this.modes = ['hug', 'run', 'jump'];
      this.modeIndex = 0;
      this.mode = this.modes[0];

      this.root = new T.Group();
      this.el.object3D.add(this.root);

      const skin   = new T.MeshStandardMaterial({color: 0x4DE3F2, roughness: 0.42, metalness: 0.05});
      const light  = new T.MeshStandardMaterial({color: 0xEAFDFF, roughness: 0.5});
      const dark   = new T.MeshStandardMaterial({color: 0x14212B, roughness: 0.6});
      const hornM  = new T.MeshStandardMaterial({color: 0xFFC857, roughness: 0.35, metalness: 0.2});
      const mouthM = new T.MeshStandardMaterial({color: 0xFF6B6B, roughness: 0.5});

      this.body = new T.Group();
      this.body.visible = this.data.showBody;
      this.root.add(this.body);

      const torso = new T.Mesh(new T.SphereGeometry(s, 24, 20), skin);
      torso.scale.set(1, 1.06, 0.94);
      this.body.add(torso);

      [-1, 1].forEach(function (side) {
        const eye = new T.Mesh(new T.SphereGeometry(s * 0.30, 16, 14), light);
        eye.position.set(side * s * 0.34, s * 0.20, s * 0.72);
        this.body.add(eye);

        const pupil = new T.Mesh(new T.SphereGeometry(s * 0.14, 12, 12), dark);
        pupil.position.set(side * s * 0.36, s * 0.20, s * 0.88);
        this.body.add(pupil);
      }, this);

      [-1, 1].forEach(function (side) {
        const h = new T.Mesh(new T.ConeGeometry(s * 0.17, s * 0.62, 12), hornM);
        h.position.set(side * s * 0.45, s * 0.98, 0);
        h.rotation.z = -side * 0.42;
        this.body.add(h);
      }, this);

      const smile = new T.Mesh(new T.TorusGeometry(s * 0.26, s * 0.055, 8, 18, Math.PI), mouthM);
      smile.position.set(0, s * 0.02, s * 0.80);
      smile.rotation.x = Math.PI;
      this.body.add(smile);

      [-1, 1].forEach(function (side) {
        const foot = new T.Mesh(new T.SphereGeometry(s * 0.27, 14, 12), skin);
        foot.position.set(side * s * 0.38, -s * 0.90, s * 0.16);
        foot.scale.set(1, 0.72, 1.25);
        this.body.add(foot);
      }, this);

      this.arms = [];
      [-1, 1].forEach(function (side) {
        const pivot = new T.Group();
        pivot.position.set(side * s * 0.92, s * 0.10, 0);
        this.body.add(pivot);

        const arm = new T.Mesh(new T.CylinderGeometry(s * 0.115, s * 0.115, s * 0.85, 12), skin);
        arm.position.y = -s * 0.42;
        pivot.add(arm);

        const hand = new T.Mesh(new T.SphereGeometry(s * 0.16, 12, 12), skin);
        hand.position.y = -s * 0.85;
        pivot.add(hand);

        this.arms.push({pivot: pivot, side: side});
      }, this);

      if (this.data.showCan) {
        const can = new T.Mesh(
          new T.CylinderGeometry(this.data.canRadius, this.data.canRadius, this.data.canHeight, 40, 1, true),
          new T.MeshBasicMaterial({color: 0x22D3EE, transparent: true, opacity: 0.16, side: T.DoubleSide})
        );
        can.position.set(0, 0, -this.data.canRadius);
        this.el.object3D.add(can);
      }
    },

    nextMode: function () {
      if (this.failed) return;
      this.modeIndex = (this.modeIndex + 1) % this.modes.length;
      this.mode = this.modes[this.modeIndex];
      this.modeTime = 0;
      this.el.emit('monster-mode', {mode: this.mode}, false);
    },

    setArms: function (spread, forward) {
      this.arms.forEach(function (a) {
        a.pivot.rotation.z = a.side * spread;
        a.pivot.rotation.x = forward;
      });
    },

    tick: function (time, delta) {
      if (this.failed || !this.root) return;

      const dt = Math.min(delta, 60) / 1000;
      this.clock += dt;
      this.modeTime += dt;

      const d = this.data;
      const s = d.size;
      const half = d.canHeight / 2;
      const groundY = -half;
      const axisZ = -d.canRadius;
      const R = d.canRadius + s * 0.95;

      if (this.modeTime >= d.modeSeconds) this.nextMode();

      if (this.mode === 'hug') {
        const sway = Math.sin(this.clock * 1.5);
        this.root.position.set(0, groundY + s * 1.02 + sway * s * 0.04, s * 0.92);
        this.root.rotation.set(0, sway * 0.18, sway * 0.05);
        this.setArms(-0.30, -1.05);
        this.root.scale.set(1 - sway * 0.03, 1 + sway * 0.04, 1 - sway * 0.03);

      } else if (this.mode === 'run') {
        const th = this.clock * d.orbitSpeed;
        const bob = Math.abs(Math.sin(this.clock * d.orbitSpeed * 2.6));
        this.root.position.set(
          R * Math.sin(th),
          groundY + s * 1.0 + bob * s * 0.28,
          axisZ + R * Math.cos(th)
        );
        this.root.rotation.set(-0.06, th + Math.PI / 2, -0.12);
        const swing = Math.sin(this.clock * d.orbitSpeed * 5.2);
        this.arms.forEach(function (a) {
          a.pivot.rotation.x = -0.35 + swing * a.side * 0.7;
          a.pivot.rotation.z = a.side * 0.35;
        });
        this.root.scale.set(1, 1, 1);

      } else {
        const TT = 2.6;
        const u = (this.clock % TT) / TT;
        const frontZ = s * 0.95;
        let y, z, k = 0;

        if (u < 0.18) {
          const t = u / 0.18;
          y = groundY + s * 1.02 - t * s * 0.25;
          z = frontZ;
          k = -0.18 * t;
        } else if (u < 0.40) {
          const t = (u - 0.18) / 0.22;
          y = (groundY + s * 0.77) + (half + s * 0.80 - (groundY + s * 0.77)) * t;
          z = frontZ + (axisZ - frontZ) * t;
          k = 0.16 * Math.sin(t * Math.PI);
        } else if (u < 0.70) {
          const t = (u - 0.40) / 0.30;
          y = half + s * 0.80 + Math.abs(Math.sin(t * Math.PI * 2)) * s * 0.18;
          z = axisZ;
          k = -0.10 * Math.abs(Math.sin(t * Math.PI * 2));
        } else if (u < 0.88) {
          const t = (u - 0.70) / 0.18;
          y = (half + s * 0.80) + ((groundY + s * 1.02) - (half + s * 0.80)) * t;
          z = axisZ + (frontZ - axisZ) * t;
          k = 0.12 * Math.sin(t * Math.PI);
        } else {
          const t = (u - 0.88) / 0.12;
          y = groundY + s * 1.02;
          z = frontZ;
          k = -0.22 * Math.sin(t * Math.PI);
        }

        this.root.position.set(0, y, z);
        this.root.rotation.set(0, 0, 0);
        this.setArms(0.62, 0);
        this.root.scale.set(1 - k * 0.55, 1 + k, 1 - k * 0.55);
      }
    }
  });
})();
</script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0F1117; }

  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(15,17,23,.85); color: #F5EFE6;
    padding: 10px 18px; border-radius: 12px;
    border: 1px solid rgba(34,211,238,.45);
    font-family: -apple-system, system-ui, sans-serif; font-size: 14px;
    text-align: center; z-index: 1000; pointer-events: none; max-width: 88vw;
    transition: background .25s, color .25s; display: none;
  }
  #hud.show { display: block; }
  #hud.found { background: rgba(34,211,238,.92); color: #0F1117; border-color: #22D3EE; }
  #hudMode { font-size: 12px; opacity: .75; margin-top: 4px; }
  #ver { font-size: 10px; opacity: .6; margin-top: 4px; }

  #hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(245,239,230,.8); font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px; z-index: 1000; pointer-events: none; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); display: none;
  }
  #hint.show { display: block; }

  /* Экран запуска — даёт тот самый тап, который требует iOS */
  #gate {
    position: fixed; inset: 0; z-index: 2000;
    background: #0F1117;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 28px;
    font-family: -apple-system, system-ui, sans-serif; text-align: center;
  }
  #gate.hidden { display: none; }
  #gate h1 { color: #22D3EE; font-size: 22px; margin: 0 0 10px; }
  #gate p { color: #F5EFE6; opacity: .75; font-size: 14px;
            line-height: 1.5; margin: 0 0 26px; max-width: 320px; }
  #startBtn {
    background: #22D3EE; color: #0F1117; border: none;
    padding: 17px 40px; border-radius: 10px;
    font-size: 18px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn:active { transform: scale(.97); }

  #dbg {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,.75); color: #7DD3FC;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    padding: 4px 8px; z-index: 3000; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>

<div id="gate">
  <h1>🎯 AR Монстр</h1>
  <p>Наведите камеру на тестовую карточку — появится монстр.</p>
  <button id="startBtn">ЗАПУСТИТЬ AR</button>
</div>

<div id="dbg">v4 · инициализация…</div>

<div id="hud">
  <div id="hudStatus">📸 Наведите камеру</div>
  <div id="hudMode">Монстр обнимает банку</div>
  <div id="ver">v4</div>
</div>

<div id="hint">Нажмите на экран, чтобы сменить анимацию</div>

<!--
  ════════════════════════════════════════════════════════════════════════
   imageTargetSrc — единственное, что меняется под вашу банку.

   СЕЙЧАС: тестовая карточка MindAR (проверяем, что весь конвейер жив).
   ПОТОМ:  imageTargetSrc: ./targets.mind;
           и файл targets.mind должен лежать рядом с этим HTML.
  ════════════════════════════════════════════════════════════════════════
-->
<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; color: #FFFFFF; intensity: 0.9" position="0.4 1 1"></a-entity>
  <a-entity light="type: hemisphere; color: #CFFAFE; groundColor: #4C1D95; intensity: 0.5"></a-entity>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity ar-monster="size: 0.13; canRadius: 0.16; canHeight: 0.72; showCan: true"></a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  const sceneEl   = document.querySelector('a-scene');
  const gate      = document.getElementById('gate');
  const startBtn  = document.getElementById('startBtn');
  const hud       = document.getElementById('hud');
  const hudStatus = document.getElementById('hudStatus');
  const hudMode   = document.getElementById('hudMode');
  const hint      = document.getElementById('hint');
  const dbgEl     = document.getElementById('dbg');

  const MODE_LABELS = {
    hug:  'Монстр обнимает банку',
    run:  'Монстр бегает вокруг банки',
    jump: 'Монстр запрыгивает на банку'
  };

  function dbg(msg) {
    console.log('[AR]', msg);
    if (dbgEl) dbgEl.textContent = 'v4 · ' + msg;
  }

  // ─── 1. Живы ли библиотеки ─────────────────────────────────────
  if (typeof AFRAME === 'undefined') {
    dbg('ОШИБКА: A-Frame не загрузился');
    gate.querySelector('p').textContent =
      'A-Frame не загрузился. Проверьте интернет и обновите страницу.';
    startBtn.style.display = 'none';
    return;
  }

  dbg(typeof THREE !== 'undefined' || AFRAME.THREE ? 'библиотеки OK' : 'Three.js не найден');

  // ─── 2. События трекинга — подписываемся сразу ─────────────────
  const targetEl = document.querySelector('[mindar-image-target]');

  targetEl.addEventListener('targetFound', function () {
    hudStatus.textContent = '✅ Изображение найдено';
    hud.classList.add('found');
    dbg('изображение найдено');
  });

  targetEl.addEventListener('targetLost', function () {
    hudStatus.textContent = '📸 Наведите камеру';
    hud.classList.remove('found');
    dbg('изображение потеряно');
  });

  // ─── 3. Готовность сцены ───────────────────────────────────────
  let sceneReady = false;

  function onSceneReady() {
    sceneReady = true;
    const sys = sceneEl.systems['mindar-image-system'];

    if (!sys) {
      dbg('ОШИБКА: MindAR не подключился');
      gate.querySelector('p').textContent =
        'MindAR не загрузился. Проверьте сеть и обновите страницу.';
      startBtn.style.display = 'none';
      return;
    }

    const mEl = document.querySelector('[ar-monster]');
    const monsterOk = !(mEl && mEl.components['ar-monster'] && mEl.components['ar-monster'].failed);

    dbg(monsterOk ? 'сцена и монстр готовы' : 'сцена готова · монстр НЕ создан (открыть консоль)');
  }

  // 'loaded' срабатывает один раз. Если сцена успела загрузиться
  // до подписки — ловим через hasLoaded.
  if (sceneEl.hasLoaded) {
    onSceneReady();
  } else {
    sceneEl.addEventListener('loaded', onSceneReady);
  }

  // ─── 4. Запуск по тапу ─────────────────────────────────────────
  startBtn.addEventListener('click', function () {
    startBtn.disabled = true;
    startBtn.textContent = 'ЗАПУСК…';
    dbg('запрашиваю камеру…');

    const sys = sceneEl.systems['mindar-image-system'];

    if (!sys) {
      dbg('ОШИБКА: mindar-image-system отсутствует');
      gate.querySelector('p').textContent =
        'MindAR не загрузился. Проверьте сеть и обновите страницу.';
      startBtn.textContent = 'ЗАПУСТИТЬ AR';
      startBtn.disabled = false;
      return;
    }

    let started;
    try {
      started = sys.start();
    } catch (err) {
      dbg('ошибка старта: ' + err.message);
      gate.querySelector('p').textContent = 'Камера не открылась: ' + err.message;
      startBtn.textContent = 'ПОВТОРИТЬ';
      startBtn.disabled = false;
      return;
    }

    Promise.resolve(started)
      .then(function () {
        dbg('камера запущена ✓');
        gate.classList.add('hidden');
        hud.classList.add('show');
        hint.classList.add('show');

        const mEl = document.querySelector('[ar-monster]');
        if (mEl) {
          mEl.addEventListener('monster-mode', function (e) {
            hudMode.textContent = MODE_LABELS[e.detail.mode] || '';
          });
        }
      })
      .catch(function (err) {
        const msg = String(err && err.message ? err.message : err);
        dbg('камера не открылась: ' + msg);

        let explain = 'Не удалось открыть камеру.';
        if (/permission|denied|notallowed/i.test(msg)) {
          explain = 'Safari не дал доступ к камере: Настройки → Safari → Камера → Разрешить.';
        } else if (/https|secure/i.test(msg)) {
          explain = 'Страница открыта без HTTPS. Нужен адрес https://.';
        }

        gate.querySelector('p').textContent = explain;
        startBtn.textContent = 'ПОВТОРИТЬ';
        startBtn.disabled = false;
      });
  });

  // ─── 5. Тап по экрану = сменить анимацию ───────────────────────
  document.addEventListener('click', function (e) {
    if (e.target === startBtn) return;
    const mEl = document.querySelector('[ar-monster]');
    if (mEl && mEl.components['ar-monster']) {
      mEl.components['ar-monster'].nextMode();
    }
  });

  window.addEventListener('error', function (e) {
    dbg('JS error: ' + (e.message || 'unknown'));
  });
})();
</script>

</body>
</html>

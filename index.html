<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Диагностика</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
// ─── Компонент монстра (тот же, что в рабочей версии) ──────────────
(function () {
  if (typeof AFRAME === 'undefined') return;

  AFRAME.registerComponent('ar-monster', {
    schema: {
      size:        {type: 'number',  default: 0.13},
      canRadius:   {type: 'number',  default: 0.16},
      canHeight:   {type: 'number',  default: 0.72},
      orbitSpeed:  {type: 'number',  default: 1.3},
      modeSeconds: {type: 'number',  default: 6.0},
      showCan:     {type: 'boolean', default: true},
      showBody:    {type: 'boolean', default: true},
      freeFloat:   {type: 'boolean', default: false}  // true = висит перед камерой, трекинг не нужен
    },

    init: function () {
      const T = window.THREE || (window.AFRAME && AFRAME.THREE) || null;
      if (!T) { console.error('[AR] нет Three.js'); this.failed = true; return; }
      this.T = T;

      try { this.build(); }
      catch (e) { console.error('[AR] ошибка сборки:', e); this.failed = true; }
    },

    build: function () {
      const T = this.T;
      const s = this.data.size;

      this.clock = 0;
      this.modeTime = 0;
      this.modes = ['hug', 'run', 'jump'];
      this.modeIndex = 0;
      this.mode = this.modes[0];

      this.root = new T.Group();
      this.el.object3D.add(this.root);

      const skin   = new T.MeshStandardMaterial({color: 0x4DE3F2, roughness: 0.42, metalness: 0.05});
      const white  = new T.MeshStandardMaterial({color: 0xEAFDFF, roughness: 0.5});
      const dark   = new T.MeshStandardMaterial({color: 0x14212B, roughness: 0.6});
      const hornM  = new T.MeshStandardMaterial({color: 0xFFC857, roughness: 0.35, metalness: 0.2});
      const mouthM = new T.MeshStandardMaterial({color: 0xFF6B6B, roughness: 0.5});

      this.body = new T.Group();
      this.body.visible = this.data.showBody;
      this.root.add(this.body);

      const torso = new T.Mesh(new T.SphereGeometry(s, 24, 20), skin);
      torso.scale.set(1, 1.06, 0.94);
      this.body.add(torso);

      [-1, 1].forEach(function (side) {
        const eye = new T.Mesh(new T.SphereGeometry(s * 0.30, 16, 14), white);
        eye.position.set(side * s * 0.34, s * 0.20, s * 0.72);
        this.body.add(eye);
        const pupil = new T.Mesh(new T.SphereGeometry(s * 0.14, 12, 12), dark);
        pupil.position.set(side * s * 0.36, s * 0.20, s * 0.88);
        this.body.add(pupil);
      }, this);

      [-1, 1].forEach(function (side) {
        const h = new T.Mesh(new T.ConeGeometry(s * 0.17, s * 0.62, 12), hornM);
        h.position.set(side * s * 0.45, s * 0.98, 0);
        h.rotation.z = -side * 0.42;
        this.body.add(h);
      }, this);

      const smile = new T.Mesh(new T.TorusGeometry(s * 0.26, s * 0.055, 8, 18, Math.PI), mouthM);
      smile.position.set(0, s * 0.02, s * 0.80);
      smile.rotation.x = Math.PI;
      this.body.add(smile);

      [-1, 1].forEach(function (side) {
        const foot = new T.Mesh(new T.SphereGeometry(s * 0.27, 14, 12), skin);
        foot.position.set(side * s * 0.38, -s * 0.90, s * 0.16);
        foot.scale.set(1, 0.72, 1.25);
        this.body.add(foot);
      }, this);

      this.arms = [];
      [-1, 1].forEach(function (side) {
        const pivot = new T.Group();
        pivot.position.set(side * s * 0.92, s * 0.10, 0);
        this.body.add(pivot);

        const arm = new T.Mesh(new T.CylinderGeometry(s * 0.115, s * 0.115, s * 0.85, 12), skin);
        arm.position.y = -s * 0.42;
        pivot.add(arm);

        const hand = new T.Mesh(new T.SphereGeometry(s * 0.16, 12, 12), skin);
        hand.position.y = -s * 0.85;
        pivot.add(hand);

        this.arms.push({pivot: pivot, side: side});
      }, this);

      if (this.data.showCan) {
        const can = new T.Mesh(
          new T.CylinderGeometry(this.data.canRadius, this.data.canRadius, this.data.canHeight, 40, 1, true),
          new T.MeshBasicMaterial({color: 0x22D3EE, transparent: true, opacity: 0.16, side: T.DoubleSide})
        );
        can.position.set(0, 0, -this.data.canRadius);
        this.el.object3D.add(can);
      }
    },

    nextMode: function () {
      if (this.failed) return;
      this.modeIndex = (this.modeIndex + 1) % this.modes.length;
      this.mode = this.modes[this.modeIndex];
      this.modeTime = 0;
      this.el.emit('monster-mode', {mode: this.mode}, false);
    },

    setArms: function (spread, forward) {
      this.arms.forEach(function (a) {
        a.pivot.rotation.z = a.side * spread;
        a.pivot.rotation.x = forward;
      });
    },

    tick: function (time, delta) {
      if (this.failed || !this.root) return;

      // Счётчик кадров — по нему видно, что цикл рендера вообще идёт
      this.frames = (this.frames || 0) + 1;
      if (this.frames % 30 === 0) {
        window.__arFrames = this.frames;
      }

      const dt = Math.min(delta, 60) / 1000;
      this.clock += dt;
      this.modeTime += dt;

      // ─── Режим «свободного полёта»: висит перед камерой ──────────
      // Трекинг не участвует. Если монстр виден здесь — рендер работает,
      // а проблема только в распознавании карты.
      if (this.data.freeFloat) {
        const bob = Math.sin(this.clock * 1.8);
        this.root.position.set(
          Math.sin(this.clock * 0.9) * 0.12,
          bob * 0.07,
          0
        );
        this.root.rotation.y = this.clock * 1.1;
        this.root.rotation.z = Math.sin(this.clock * 1.5) * 0.08;
        this.setArms(-0.28 + bob * 0.15, -0.4);
        const k = Math.sin(this.clock * 1.8) * 0.03;
        this.root.scale.set(1 - k, 1 + k, 1 - k);
        return;
      }

      const d = this.data;
      const s = d.size;
      const half = d.canHeight / 2;
      const groundY = -half;
      const axisZ = -d.canRadius;
      const R = d.canRadius + s * 0.95;

      if (this.modeTime >= d.modeSeconds) this.nextMode();

      if (this.mode === 'hug') {
        const sway = Math.sin(this.clock * 1.5);
        this.root.position.set(0, groundY + s * 1.02 + sway * s * 0.04, s * 0.92);
        this.root.rotation.set(0, sway * 0.18, sway * 0.05);
        this.setArms(-0.30, -1.05);
        this.root.scale.set(1 - sway * 0.03, 1 + sway * 0.04, 1 - sway * 0.03);

      } else if (this.mode === 'run') {
        const th = this.clock * d.orbitSpeed;
        const bob = Math.abs(Math.sin(this.clock * d.orbitSpeed * 2.6));
        this.root.position.set(
          R * Math.sin(th),
          groundY + s * 1.0 + bob * s * 0.28,
          axisZ + R * Math.cos(th)
        );
        this.root.rotation.set(-0.06, th + Math.PI / 2, -0.12);
        const swing = Math.sin(this.clock * d.orbitSpeed * 5.2);
        this.arms.forEach(function (a) {
          a.pivot.rotation.x = -0.35 + swing * a.side * 0.7;
          a.pivot.rotation.z = a.side * 0.35;
        });
        this.root.scale.set(1, 1, 1);

      } else {
        const TT = 2.6;
        const u = (this.clock % TT) / TT;
        const frontZ = s * 0.95;
        let y, z, k = 0;

        if (u < 0.18) {
          const t = u / 0.18;
          y = groundY + s * 1.02 - t * s * 0.25; z = frontZ; k = -0.18 * t;
        } else if (u < 0.40) {
          const t = (u - 0.18) / 0.22;
          y = (groundY + s * 0.77) + (half + s * 0.80 - (groundY + s * 0.77)) * t;
          z = frontZ + (axisZ - frontZ) * t;
          k = 0.16 * Math.sin(t * Math.PI);
        } else if (u < 0.70) {
          const t = (u - 0.40) / 0.30;
          y = half + s * 0.80 + Math.abs(Math.sin(t * Math.PI * 2)) * s * 0.18;
          z = axisZ;
          k = -0.10 * Math.abs(Math.sin(t * Math.PI * 2));
        } else if (u < 0.88) {
          const t = (u - 0.70) / 0.18;
          y = (half + s * 0.80) + ((groundY + s * 1.02) - (half + s * 0.80)) * t;
          z = axisZ + (frontZ - axisZ) * t;
          k = 0.12 * Math.sin(t * Math.PI);
        } else {
          const t = (u - 0.88) / 0.12;
          y = groundY + s * 1.02; z = frontZ; k = -0.22 * Math.sin(t * Math.PI);
        }

        this.root.position.set(0, y, z);
        this.root.rotation.set(0, 0, 0);
        this.setArms(0.62, 0);
        this.root.scale.set(1 - k * 0.55, 1 + k, 1 - k * 0.55);
      }
    }
  });
})();
</script>

<style>
  /* Никакого фона у html/body — иначе перекроет видео от камеры */
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: transparent;
  }

  a-scene video, .a-scene video {
    position: absolute !important;
    top: 0 !important; left: 0 !important;
    width: 100% !important; height: 100% !important;
    object-fit: cover !important;
    z-index: -2 !important;
  }
  .a-canvas { background: transparent !important; }

  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 14px 16px; text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
    pointer-events: none;
  }
  #track {
    display: inline-block; padding: 10px 22px; border-radius: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: .3px;
    background: rgba(180, 30, 30, .9); color: #fff;
  }
  #track.ok { background: rgba(20, 160, 120, .95); }
  #meta {
    margin-top: 8px; font-size: 11px; color: #EAFDFF;
    font-family: ui-monospace, Menlo, monospace;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }

  #gate {
    position: fixed; inset: 0; z-index: 2000; background: #0F1117;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 28px; text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #gate.hidden { display: none; }
  #gate h1 { color: #22D3EE; font-size: 21px; margin: 0 0 12px; }
  #gate p { color: #F5EFE6; opacity: .78; font-size: 14px;
            line-height: 1.55; margin: 0 0 24px; max-width: 330px; }
  #startBtn {
    background: #22D3EE; color: #0F1117; border: none;
    padding: 17px 40px; border-radius: 10px;
    font-size: 18px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn:active { transform: scale(.97); }

  #dbg {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 3000;
    background: rgba(0,0,0,.65); color: #7DD3FC;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    padding: 3px 8px; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>

<div id="gate">
  <h1>🔬 Диагностика AR</h1>
  <p>
    Сначала появится монстр прямо перед камерой — это проверка отрисовки.
    Потом наведите камеру на тестовую карточку, чтобы проверить распознавание.
  </p>
  <button id="startBtn">ЗАПУСТИТЬ</button>
</div>

<div id="status">
  <div id="track">КАРТА НЕ НАЙДЕНА</div>
  <div id="meta">—</div>
</div>

<div id="dbg">diag-1 · инициализация…</div>

<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; color: #FFFFFF; intensity: 1" position="0.5 1 1"></a-entity>
  <a-entity light="type: hemisphere; color: #CFFAFE; groundColor: #4C1D95; intensity: 0.6"></a-entity>

  <!-- ① КОНТРОЛЬНЫЙ МОНСТР — висит перед камерой, трекинг не нужен.
       Нужен, чтобы отделить «не рисуется» от «не находит карту». -->
  <a-entity position="0 0 -1.1" scale="2.2 2.2 2.2">
    <a-entity ar-monster="size: 0.13; freeFloat: true; showCan: false"></a-entity>
  </a-entity>

  <!-- ② МОНСТР НА КАРТЕ — появляется только при распознавании -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity ar-monster="size: 0.13; canRadius: 0.16; canHeight: 0.72; showCan: true"></a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  const sceneEl  = document.querySelector('a-scene');
  const gate     = document.getElementById('gate');
  const startBtn = document.getElementById('startBtn');
  const trackEl  = document.getElementById('track');
  const metaEl   = document.getElementById('meta');
  const dbgEl    = document.getElementById('dbg');

  let frames = 0;

  function dbg(msg) {
    console.log('[AR]', msg);
    if (dbgEl) dbgEl.textContent = 'diag-1 · ' + msg;
  }

  if (typeof AFRAME === 'undefined') {
    dbg('A-Frame не загрузился');
    gate.querySelector('p').textContent = 'A-Frame не загрузился. Обновите страницу.';
    startBtn.style.display = 'none';
    return;
  }

  // ─── Раз в секунду показываем состояние ────────────────────────
  setInterval(function () {
    const v = document.querySelector('a-scene video') || document.querySelector('video');

    // Счётчик кадров монстра: если растёт — цикл рендера живой
    const f = window.__arFrames || 0;
    const rendering = f > frames;
    frames = f;

    metaEl.textContent =
      'видео ' + (v ? v.videoWidth + '×' + v.videoHeight : 'нет') +
      ' · кадры ' + f + (rendering ? ' ▲' : ' —') +
      ' · монстр ' + (window.__monsterState || '?');
  }, 1000);

  // ─── Состояние монстров ────────────────────────────────────────
  sceneEl.addEventListener('loaded', function () {
    const monsters = document.querySelectorAll('[ar-monster]');
    let failed = 0;

    monsters.forEach(function (el) {
      const c = el.components['ar-monster'];
      if (!c || c.failed) failed++;
    });

    window.__monsterState = failed === 0
      ? 'OK (' + monsters.length + ')'
      : 'СБОЙ (' + failed + ' из ' + monsters.length + ')';

    dbg('сцена готова · монстры: ' + window.__monsterState);
  });

  // ─── Трекинг ───────────────────────────────────────────────────
  const targetEl = document.querySelector('[mindar-image-target]');

  targetEl.addEventListener('targetFound', function () {
    trackEl.textContent = '✅ КАРТА НАЙДЕНА';
    trackEl.classList.add('ok');
    dbg('КАРТА НАЙДЕНА');
  });

  targetEl.addEventListener('targetLost', function () {
    trackEl.textContent = 'КАРТА НЕ НАЙДЕНА';
    trackEl.classList.remove('ok');
    dbg('карта потеряна');
  });

  // ─── Запуск ────────────────────────────────────────────────────
  startBtn.addEventListener('click', function () {
    startBtn.disabled = true;
    startBtn.textContent = 'ЗАПУСК…';

    const sys = sceneEl.systems['mindar-image-system'];
    if (!sys) {
      dbg('MindAR не подключился');
      gate.querySelector('p').textContent = 'MindAR не загрузился. Обновите страницу.';
      startBtn.textContent = 'ЗАПУСТИТЬ';
      startBtn.disabled = false;
      return;
    }

    Promise.resolve()
      .then(function () { return sys.start(); })
      .then(function () {
        gate.classList.add('hidden');
        dbg('камера запущена');
      })
      .catch(function (err) {
        const msg = String(err && err.message ? err.message : err);
        dbg('ошибка: ' + msg);
        gate.querySelector('p').textContent = 'Камера не открылась: ' + msg;
        startBtn.textContent = 'ПОВТОРИТЬ';
        startBtn.disabled = false;
      });
  });
})();
</script>

</body>
</html>
